<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96" role="img" aria-label="Event">
  <defs>
    <linearGradient id="ge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f7768e"/>
      <stop offset="100%" stop-color="#bb9af7"/>
    </linearGradient>
  </defs>
  <circle cx="48" cy="48" r="30" fill="none" stroke="#f7768e" stroke-width="2" opacity="0.5">
    <animate attributeName="r" values="30;40;30" dur="2.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0;0.5" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="48" cy="48" r="26" fill="url(#ge)" opacity="0.18"/>
  <circle cx="48" cy="48" r="20" fill="#1a1b27" stroke="url(#ge)" stroke-width="2"/>
  <!-- mic -->
  <rect x="42" y="34" width="12" height="22" rx="6" fill="#c0caf5"/>
  <path d="M36 50 C36 60 60 60 60 50" fill="none" stroke="#7aa2f7" stroke-width="2.4"/>
  <line x1="48" y1="60" x2="48" y2="66" stroke="#7aa2f7" stroke-width="2.4"/>
  <line x1="42" y1="66" x2="54" y2="66" stroke="#7aa2f7" stroke-width="2.4" stroke-linecap="round"/>
  <!-- sound waves -->
  <path d="M62 40 C66 44 66 52 62 56" fill="none" stroke="#e0af68" stroke-width="2" stroke-linecap="round">
    <animate attributeName="opacity" values="1;0.2;1" dur="1.3s" repeatCount="indefinite"/>
  </path>
</svg>
