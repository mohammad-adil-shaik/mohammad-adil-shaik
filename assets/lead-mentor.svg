<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96" role="img" aria-label="Mentor">
  <defs>
    <linearGradient id="gm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7aa2f7"/>
      <stop offset="100%" stop-color="#bb9af7"/>
    </linearGradient>
  </defs>
  <circle cx="48" cy="48" r="30" fill="none" stroke="#7aa2f7" stroke-width="2" opacity="0.5">
    <animate attributeName="r" values="30;40;30" dur="2.7s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0;0.5" dur="2.7s" repeatCount="indefinite"/>
  </circle>
  <circle cx="48" cy="48" r="26" fill="url(#gm)" opacity="0.18"/>
  <circle cx="48" cy="48" r="20" fill="#1a1b27" stroke="url(#gm)" stroke-width="2"/>
  <!-- person + cap -->
  <circle cx="48" cy="44" r="6" fill="#c0caf5"/>
  <path d="M36 62 C36 54 60 54 60 62 Z" fill="#c0caf5"/>
  <polygon points="48,32 62,37 48,42 34,37" fill="#7aa2f7"/>
  <line x1="62" y1="37" x2="62" y2="44" stroke="#e0af68" stroke-width="1.6"/>
  <circle cx="62" cy="45" r="2" fill="#f7768e">
    <animate attributeName="opacity" values="1;0.4;1" dur="1.4s" repeatCount="indefinite"/>
  </circle>
</svg>
