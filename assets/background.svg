<svg xmlns="http://www.w3.org/2000/svg" width="420" height="320" viewBox="0 0 420 320" role="img" aria-label="Developer code card">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1b27"/>
      <stop offset="100%" stop-color="#24283b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7aa2f7"/>
      <stop offset="100%" stop-color="#bb9af7"/>
    </linearGradient>
  </defs>

  <rect width="420" height="320" rx="16" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="419" height="319" rx="16" fill="none" stroke="url(#accent)" stroke-opacity="0.45"/>

  <circle cx="28" cy="26" r="5" fill="#f7768e"/>
  <circle cx="46" cy="26" r="5" fill="#e0af68"/>
  <circle cx="64" cy="26" r="5" fill="#9ece6a"/>
  <text x="86" y="30" font-family="monospace" font-size="11" fill="#565f89">engineer.ts</text>

  <g font-family="monospace" font-size="12.5" fill="#c0caf5">
    <text x="24" y="64"><tspan fill="#bb9af7">const</tspan> <tspan fill="#7aa2f7">engineer</tspan> = {</text>
    <text x="40" y="86"><tspan fill="#9ece6a">name</tspan>: <tspan fill="#e0af68">"Mohammad Adil"</tspan>,</text>
    <text x="40" y="108"><tspan fill="#9ece6a">role</tspan>: <tspan fill="#e0af68">"Full Stack + Backend"</tspan>,</text>
    <text x="40" y="130"><tspan fill="#9ece6a">languages</tspan>: [<tspan fill="#e0af68">"Java"</tspan>, <tspan fill="#e0af68">"Python"</tspan>, <tspan fill="#e0af68">"TS"</tspan>],</text>
    <text x="40" y="152"><tspan fill="#9ece6a">backend</tspan>: [<tspan fill="#e0af68">"Spring"</tspan>, <tspan fill="#e0af68">"Node"</tspan>, <tspan fill="#e0af68">"Django"</tspan>],</text>
    <text x="40" y="174"><tspan fill="#9ece6a">frontend</tspan>: [<tspan fill="#e0af68">"React"</tspan>, <tspan fill="#e0af68">"Next.js"</tspan>],</text>
    <text x="40" y="196"><tspan fill="#9ece6a">cloud</tspan>: [<tspan fill="#e0af68">"AWS"</tspan>, <tspan fill="#e0af68">"Docker"</tspan>, <tspan fill="#e0af68">"K8s"</tspan>],</text>
    <text x="40" y="218"><tspan fill="#9ece6a">data</tspan>: [<tspan fill="#e0af68">"PostgreSQL"</tspan>, <tspan fill="#e0af68">"Redis"</tspan>],</text>
    <text x="40" y="240"><tspan fill="#9ece6a">building</tspan>: <tspan fill="#e0af68">"scalable systems"</tspan>,</text>
    <text x="40" y="262"><tspan fill="#9ece6a">shipsToProd</tspan>: <tspan fill="#7dcfff">true</tspan></text>
    <text x="24" y="284">};</text>
  </g>

  <rect x="50" y="274" width="8" height="13" fill="#7aa2f7">
    <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>

  <circle cx="380" cy="56" r="6" fill="#bb9af7">
    <animate attributeName="r" values="6;9;6" dur="2.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.9;0.4;0.9" dur="2.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="360" cy="290" r="4" fill="#7aa2f7">
    <animate attributeName="r" values="4;7;4" dur="3s" repeatCount="indefinite"/>
  </circle>
</svg>
