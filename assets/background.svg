<svg xmlns="http://www.w3.org/2000/svg" width="360" height="240" viewBox="0 0 360 240" role="img" aria-label="Developer illustration">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1b27"/>
      <stop offset="100%" stop-color="#24283b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7aa2f7"/>
      <stop offset="100%" stop-color="#bb9af7"/>
    </linearGradient>
  </defs>

  <rect width="360" height="240" rx="16" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="359" height="239" rx="16" fill="none" stroke="url(#accent)" stroke-opacity="0.4"/>

  <!-- window chrome -->
  <circle cx="28" cy="26" r="5" fill="#f7768e"/>
  <circle cx="46" cy="26" r="5" fill="#e0af68"/>
  <circle cx="64" cy="26" r="5" fill="#9ece6a"/>

  <!-- code lines -->
  <g font-family="monospace" font-size="13" fill="#c0caf5">
    <text x="26" y="70"><tspan fill="#bb9af7">const</tspan> <tspan fill="#7aa2f7">engineer</tspan> = {</text>
    <text x="44" y="94"><tspan fill="#9ece6a">name</tspan>: <tspan fill="#e0af68">"Adil"</tspan>,</text>
    <text x="44" y="118"><tspan fill="#9ece6a">stack</tspan>: [<tspan fill="#e0af68">"Java"</tspan>, <tspan fill="#e0af68">"React"</tspan>],</text>
    <text x="44" y="142"><tspan fill="#9ece6a">cloud</tspan>: <tspan fill="#e0af68">"AWS"</tspan>,</text>
    <text x="44" y="166"><tspan fill="#9ece6a">ships</tspan>: <tspan fill="#7dcfff">true</tspan></text>
    <text x="26" y="190">};</text>
  </g>

  <!-- blinking cursor -->
  <rect x="52" y="180" width="8" height="14" fill="#7aa2f7">
    <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>

  <!-- pulsing accent dot -->
  <circle cx="320" cy="60" r="6" fill="#bb9af7">
    <animate attributeName="r" values="6;9;6" dur="2.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.9;0.4;0.9" dur="2.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="300" cy="210" r="4" fill="#7aa2f7">
    <animate attributeName="r" values="4;7;4" dur="3s" repeatCount="indefinite"/>
  </circle>
</svg>
